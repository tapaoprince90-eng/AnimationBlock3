          cat > src/main/java/com/example/animtool/client/StickScreen.java <<'EOF'
          package com.example.animtool.client;

          import java.util.Locale;
          import java.util.function.DoubleConsumer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.MathHelper;

          public class StickScreen extends Screen {
              private final Slide[] sl = new Slide[6];

              public StickScreen() {
                  super(Text.literal("Animation Mover"));
              }

              static class Slide extends SliderWidget {
                  private final String label;
                  private final double min;
                  private final double max;
                  private final double step;
                  private final DoubleConsumer cb;

                  Slide(int x, int y, int w, int h, String label, double min, double max, double step, double start, DoubleConsumer cb) {
                      super(x, y, w, h, Text.empty(), MathHelper.clamp((start - min) / (max - min), 0.0, 1.0));
                      this.label = label;
                      this.min = min;
                      this.max = max;
                      this.step = step;
                      this.cb = cb;
                      updateMessage();
                  }

                  double get() {
                      double raw = min + value * (max - min);
                      return Math.round(raw / step) * step;
                  }

                  void setTo(double v) {
                      value = MathHelper.clamp((v - min) / (max - min), 0.0, 1.0);
                      updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      if (label == null) return;
                      setMessage(Text.literal(label + ": " + String.format(Locale.ROOT, "%.1f", get())));
                  }

                  @Override
                  protected void applyValue() {
                      cb.accept(get());
                  }
              }

              private void sendPose() {
                  float[] p = AnimToolClient.pose;
                  AnimToolClient.send("stick set " + p[0] + " " + p[1] + " " + p[2] + " " + p[3] + " " + p[4] + " " + p[5]);
              }

              private void btn(int x, int y, int w, String label, String cmd) {
                  addDrawableChild(ButtonWidget.builder(Text.literal(label), b -> AnimToolClient.send(cmd))
                      .dimensions(x, y, w, 20).build());
              }

              @Override
              protected void init() {
                  int cx = width / 2;
                  String[] names = {"Left/Right (X)", "Up/Down (Y)", "Front/Back (Z)", "Rotate X", "Rotate Y", "Rotate Z"};
                  for (int i = 0; i < 6; i++) {
                      int col = i / 3;
                      int row = i % 3;
                      int x = col == 0 ? cx - 155 : cx + 5;
                      int y = 40 + row * 24;
                      double min = i < 3 ? -6 : -180;
                      double max = i < 3 ? 6 : 180;
                      double step = i < 3 ? 0.1 : 1.0;
                      final int idx = i;
                      sl[i] = new Slide(x, y, 150, 20, names[i], min, max, step, AnimToolClient.pose[i], v -> {
                          AnimToolClient.pose[idx] = (float) v;
                          sendPose();
                      });
                      addDrawableChild(sl[i]);
                  }
                  btn(cx - 155, 118, 70, "< Frame", "stick prev");
                  btn(cx + 85, 118, 70, "Frame >", "stick next");
                  btn(cx - 155, 144, 150, "Reset this frame", "stick reset");
                  btn(cx + 5, 144, 150, "Put back as block", "stick back");
                  addDrawableChild(ButtonWidget.builder(Text.literal("Close"), b -> close())
                      .dimensions(cx - 50, 168, 100, 20).build());
              }

              public void refresh() {
                  for (int i = 0; i < 6; i++) {
                      if (sl[i] != null) sl[i].setTo(AnimToolClient.pose[i]);
                  }
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }

              @Override
              public void render(DrawContext c, int mx, int my, float delta) {
                  super.render(c, mx, my, delta);
                  int cx = width / 2;
                  c.drawCenteredTextWithShadow(textRenderer, "Animation Mover", cx, 8, 0xFFFFFFFF);
                  c.drawCenteredTextWithShadow(textRenderer, "MOVE (blocks)", cx - 80, 28, 0xFF55FFFF);
                  c.drawCenteredTextWithShadow(textRenderer, "ROTATE (degrees)", cx + 80, 28, 0xFFFFFF55);
                  c.drawCenteredTextWithShadow(textRenderer,
                      "Frame " + (AnimToolClient.cur + 1) + " / " + AnimToolClient.count, cx, 124, 0xFFFFFFFF);
              }
          }
          EOF

