          package com.example.animtool.client;

          import com.example.animtool.ClientMsg;
          import com.example.animtool.ServerMsg;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.MinecraftClient;

          public class AnimToolClient implements ClientModInitializer {
              public static int cur = 0;
              public static int count = 2;
              public static int dur = 20;
              public static boolean playing = false;
              public static boolean hasObj = false;
              public static final float[] pose = new float[6];

              public static void send(String s) {
                  ClientPlayNetworking.send(new ClientMsg(s));
              }

              @Override
              public void onInitializeClient() {
                  ClientPlayNetworking.registerGlobalReceiver(ServerMsg.ID, (payload, context) -> handle(payload.text()));
              }

              static void handle(String m) {
                  try {
                      String[] a = m.split(" ");
                      MinecraftClient mc = MinecraftClient.getInstance();
                      switch (a[0]) {
                          case "S": {
                              int oldCount = count;
                              cur = Integer.parseInt(a[1]);
                              count = Integer.parseInt(a[2]);
                              playing = a[3].equals("1");
                              dur = Integer.parseInt(a[4]);
                              if (oldCount != count && mc.currentScreen instanceof PaperScreen) {
                                  mc.setScreen(new PaperScreen());
                              }
                              break;
                          }
                          case "P": {
                              if (a[1].equals("none")) {
                                  hasObj = false;
                              } else {
                                  hasObj = true;
                                  for (int k = 0; k < 6; k++) pose[k] = Float.parseFloat(a[1 + k]);
                              }
                              if (mc.currentScreen instanceof StickScreen ss) ss.refresh();
                              break;
                          }
                          case "OPEN": {
                              if (a[1].equals("paper")) mc.setScreen(new PaperScreen());
                              else mc.setScreen(new StickScreen());
                              break;
                          }
                          case "CLOSE": {
                              mc.setScreen(null);
                              break;
                          }
                          default: break;
                      }
                  } catch (RuntimeException ex) {
                      // ignore bad message
                  }
              }
          }
          EOF

